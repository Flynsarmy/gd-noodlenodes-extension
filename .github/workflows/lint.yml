name: Lint
on:
  workflow_dispatch:
  workflow_call:

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # Pinned: unpinned clang-format changes its formatting rules between releases.
      - name: Install clang-format
        shell: bash
        run: python -m pip install clang-format==23.1.5
      - name: Run clang-format
        shell: bash
        run: |
          find src -type f \( -name '*.cpp' -o -name '*.h' \) -exec clang-format --style=file:.clang-format --dry-run --Werror {} +

  gdlint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install gdtoolkit
        shell: bash
        run: python -m pip install gdtoolkit==4.5.0
      - name: Run gdlint
        shell: bash
        run: gdlint demo
