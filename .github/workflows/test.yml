name: Test

on:
  workflow_call:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    # Godot runs under -d, so a hang would otherwise sit until the 6h default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Test Library
        uses: actions/download-artifact@v8
        with:
          name: noodlenodes-linux-x86_64-template_debug
          path: ${{ github.workspace }}/demo/addons/noodle_nodes/bin/

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux.x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: sh
        run: |
          mkdir -p "${{ runner.tool_cache }}/godot"
          curl -fL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d "${{ runner.tool_cache }}/godot"
          mv "${{ runner.tool_cache }}/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "${{ runner.tool_cache }}/godot/godot"
          chmod +x "${{ runner.tool_cache }}/godot/godot"

      - name: Add Godot to PATH
        run: echo "${{ runner.tool_cache }}/godot" >> "$GITHUB_PATH"

      - name: Run tests
        shell: sh
        working-directory: demo
        run: |
          godot --headless --path . --import --quit
          godot --headless --path . -d -s addons/gut/gut_cmdln.gd -gdir=res://test/ -gprefix=test_ -gsuffix=.gd -gexit -ginclude_subdirs
